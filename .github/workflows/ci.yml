name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python tests/test_decide.py
      - run: python tests/test_correlate.py
      - run: triage --demo -i examples/sample-trivy.json -a examples/assets.json
      - run: >-
          triage-correlate
          --scope examples/correlation/scope.json
          --observations examples/correlation/observations.json
          --advisories examples/correlation/advisories.json
          --ground-truth examples/correlation/ground-truth.json
          --as-of 2026-08-14T00:00:00Z
          --out /tmp/correlation-benchmark.json
