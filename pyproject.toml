[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-triage"
version = "0.1.0"
description = "Exploit-aware vulnerability triage. Stop scanning, start deciding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ahmed Hassan" }]
keywords = ["vulnerability", "cve", "kev", "epss", "mitre-attack", "prioritization", "cyber-risk"]
dependencies = []

[project.scripts]
triage = "triage_cli.main:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
triage_core = ["data/*.json", "data/*.csv"]
